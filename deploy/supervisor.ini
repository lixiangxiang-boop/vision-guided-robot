; ═══════════════════════════════════════════════════════════════
; 宝塔 Supervisor 进程守护配置
; ═══════════════════════════════════════════════════════════════
;
; 使用方法:
; 1. 宝塔面板 → 软件商店 → Supervisor → 设置 → 添加守护进程
; 2. 分别添加以下3个进程（或直接导入此文件）
; 3. 依次启动
; ═══════════════════════════════════════════════════════════════

[program:vision-robot-vision]
directory=/www/wwwroot/YOUR_DOMAIN.COM
command=/usr/bin/python3 services/vision_service.py --port 8801
autostart=true
autorestart=true
startsecs=3
user=www
stdout_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/vision.log
stderr_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/vision-error.log
environment=PYTHONUNBUFFERED="1"

[program:vision-robot-robot]
directory=/www/wwwroot/YOUR_DOMAIN.COM
command=/usr/bin/python3 services/robot_service.py --port 8802
autostart=true
autorestart=true
startsecs=3
user=www
stdout_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/robot.log
stderr_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/robot-error.log
environment=PYTHONUNBUFFERED="1"

[program:vision-robot-agent]
directory=/www/wwwroot/YOUR_DOMAIN.COM
command=/usr/bin/python3 services/agent_service.py --port 8803
autostart=true
autorestart=true
startsecs=3
user=www
stdout_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/agent.log
stderr_logfile=/www/wwwroot/YOUR_DOMAIN.COM/logs/agent-error.log
environment=PYTHONUNBUFFERED="1",DEEPSEEK_API_KEY="sk-your-key-here",DEEPSEEK_BASE_URL="https://api.deepseek.com/v1",VISION_URL="http://127.0.0.1:8801",ROBOT_URL="http://127.0.0.1:8802"
