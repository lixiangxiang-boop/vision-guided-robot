# ═══════════════════════════════════════════════════════════════
# 视觉引导机器人操控系统 — Nginx 配置 (宝塔面板)
# ═══════════════════════════════════════════════════════════════
#
# 使用方法：
# 1. 宝塔面板 → 网站 → 你的域名 → 设置 → 配置文件
# 2. 将下面的 location 块粘贴到 server { } 块内
# 3. 将 root 指向 web/ 目录的绝对路径
# 4. 保存并重启 Nginx
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name YOUR_DOMAIN.COM;  # ← 替换为你的域名

    # 网站根目录 → 指向项目的 web/ 文件夹
    root /www/wwwroot/YOUR_DOMAIN.COM/web;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # STL 模型文件缓存 (7天)
    location ~* \.stl$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ──────────── API 反向代理 ────────────

    # Agent 服务 (含 SSE 流式聊天)
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8803/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持 (chat/stream)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 视觉服务
    location /api/vision/ {
        proxy_pass http://127.0.0.1:8801/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 机器人服务
    location /api/robot/ {
        proxy_pass http://127.0.0.1:8802/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 健康检查端点
    location /api/health {
        return 200 '{"status":"ok","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }
}
