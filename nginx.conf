server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent API 代理
    location /api/agent/ {
        proxy_pass http://agent:8803/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;

        # SSE 支持
        chunked_transfer_encoding on;
    }

    # 视觉 API 代理
    location /api/vision/ {
        proxy_pass http://vision:8801/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 机器人 API 代理
    location /api/robot/ {
        proxy_pass http://robot:8802/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
